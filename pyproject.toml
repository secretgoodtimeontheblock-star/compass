[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass"
version = "0.1.0"
description = "Лёгкий десктопный помощник трейдера: МосБиржа + крипта, сигналы, бэктест, журнал, AI-разбор. Без автоторговли."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pandas>=2.2",
  "ccxt>=4.4",
  "numpy>=1.26",
  "anthropic",
  "aiohttp>=3.10",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
compass = "compass.__main__:main"

[project.gui-scripts]
compass-desktop = "compass.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
